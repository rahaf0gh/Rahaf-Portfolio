<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>منظم المعلم</title><style>
:root{--p:#6757dc;--n:#171a2e;--bg:#f6f7fb;--c:#fff;--m:#777b91;--l:#e8e9f0}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Tahoma,Arial;color:#191b2b}button,input,select{font:inherit}.top{background:#fff;border-bottom:1px solid var(--l);padding:14px 18px;position:sticky;top:0;z-index:5}.topin{max-width:1150px;margin:auto;display:flex;justify-content:space-between;align-items:center}.brand{font-weight:800;display:flex;gap:10px;align-items:center}.logo{width:36px;height:36px;border-radius:11px;background:linear-gradient(135deg,var(--p),#a596ff);color:#fff;display:grid;place-items:center}.wrap{max-width:1150px;margin:auto;padding:22px 16px 80px}.admin{display:grid;grid-template-columns:220px 1fr;gap:20px}.side{background:var(--n);padding:14px;border-radius:22px;height:fit-content;position:sticky;top:78px}.side button{width:100%;background:transparent;color:#dce0ef;border:0;padding:12px;border-radius:12px;text-align:right;cursor:pointer;margin:3px 0}.side button.on,.side button:hover{background:var(--p);color:#fff}.hero{display:flex;justify-content:space-between;gap:14px;align-items:flex-start;margin-bottom:16px}.hero h1{margin:0 0 6px}.muted{color:var(--m)}.btn{border:0;border-radius:12px;padding:10px 14px;cursor:pointer;font-weight:700}.primary{background:var(--p);color:#fff}.soft{background:#fff;border:1px solid var(--l)}.grid{display:grid;gap:14px}.stats{grid-template-columns:repeat(4,1fr);margin-bottom:16px}.card,.stat{background:#fff;border:1px solid var(--l);border-radius:18px;padding:16px;box-shadow:0 10px 28px rgba(20,23,45,.06)}.stat b{display:block;font-size:26px;margin-top:6px}.teacher{display:grid;grid-template-columns:1.1fr 1fr 1.5fr auto;gap:10px;padding:12px;border:1px solid var(--l);border-radius:13px;align-items:center;margin:8px 0}.tag{display:inline-block;background:#f1efff;color:var(--p);padding:6px 9px;border-radius:999px;font-size:12px;margin:2px}.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:grid;gap:6px}.field input,.field select{border:1px solid var(--l);border-radius:11px;padding:10px;background:#fff}.span{grid-column:1/-1}.groups{display:grid;gap:8px}.grouprow{display:grid;grid-template-columns:1fr 1fr auto;gap:8px}.teacherHead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:16px}.teacherMain{display:grid;grid-template-columns:1.4fr .8fr;gap:16px}.today{grid-template-columns:repeat(3,1fr)}.task{display:flex;align-items:center;gap:10px;border:1px solid var(--l);padding:11px;border-radius:12px;margin:8px 0}.task>div{flex:1}.red{background:#ffe9e9;color:#b73535}.orange{background:#fff1d8;color:#956000}.blue{background:#e8f1ff;color:#2d63b5}.event{display:grid;grid-template-columns:58px 1fr;gap:10px;padding:10px;border:1px solid var(--l);border-radius:12px;margin:8px 0}.date{background:#f1efff;color:var(--p);border-radius:10px;text-align:center;padding:8px;font-weight:800}.nav{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px}.nav button{border:1px solid var(--l);background:#fff;padding:8px 11px;border-radius:10px;cursor:pointer}.nav button.on{background:var(--n);color:#fff}.table{width:100%;border-collapse:collapse;min-width:640px}.table th,.table td{padding:10px;border-bottom:1px solid var(--l);text-align:right}.scroll{overflow:auto}.bottom{display:none}
@media(max-width:850px){.admin{grid-template-columns:1fr}.side{position:static}.stats{grid-template-columns:1fr 1fr}.teacherMain{grid-template-columns:1fr}.teacher{grid-template-columns:1fr 1fr}.form{grid-template-columns:1fr}.span{grid-column:auto}}@media(max-width:600px){.side{display:none}.teacher{grid-template-columns:1fr}.today{grid-template-columns:repeat(3,1fr);gap:8px}.stat{padding:12px}.stat b{font-size:22px}.bottom{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--l);z-index:10}.bottom button{border:0;background:#fff;padding:10px 3px;font-size:11px}.bottom button.on{color:var(--p);font-weight:800}}
</style></head><body><div id="app"></div><script>
const stages={ابتدائي:['الأول','الثاني','الثالث','الرابع','الخامس','السادس'],متوسط:['الأول','الثاني','الثالث'],ثانوي:['الأول','الثاني','الثالث']};
const seed={teachers:[{name:'سارة أحمد',subject:'رياضيات',school:'المتوسطة الأولى',slug:'sara-ahmed',groups:[{stage:'ابتدائي',grade:'السادس'},{stage:'متوسط',grade:'الأول'},{stage:'متوسط',grade:'الثاني'}],assign:['نافس','مناوبة','نشاط'],schedule:[['الأحد',1,'7:00 - 7:40','متوسط','الأول','أ'],['الأحد',2,'7:50 - 8:30','متوسط','الثاني','ب'],['الأحد',3,'8:40 - 9:20','ابتدائي','السادس','أ'],['الاثنين',1,'7:00 - 7:40','متوسط','الأول','ب']],tasks:[['تصحيح اختبار 2/أ',1,1,'متوسط','الثاني'],['رصد درجات 1/ب',1,0,'متوسط','الأول'],['رفع تقرير نافس',0,1,'متوسط','الثاني']],events:[['7','أكتوبر','اختبار 2/أ'],['10','أكتوبر','تسليم تقرير نافس'],['15','أكتوبر','اجتماع النشاط']]}]};
let db=JSON.parse(localStorage.getItem('tp-demo')||'null')||seed;const save=()=>localStorage.setItem('tp-demo',JSON.stringify(db));
const el=id=>document.getElementById(id), q=(s,r=document)=>r.querySelector(s), qa=(s,r=document)=>[...r.querySelectorAll(s)];
function top(){return '<div class="top"><div class="topin"><div class="brand"><div class="logo">▣</div>منظم المعلم</div><button class="btn soft" onclick="admin()">لوحة المالك</button></div></div>'}
function admin(page='home'){history.replaceState({},'',location.pathname);app.innerHTML=top()+'<div class="wrap admin"><aside class="side"><button class="'+(page==='home'?'on':'')+'" onclick="admin()">الرئيسية</button><button class="'+(page==='new'?'on':'')+'" onclick="admin(\'new\')">إضافة معلم</button><button onclick="reset()">إعادة التجربة</button></aside><main id="main"></main></div>';page==='new'?form():home()}
function home(){let t=db.teachers[0];main.innerHTML='<div class="hero"><div><h1>لوحة التحكم</h1><div class="muted">إدارة المعلمين والجداول والتكليفات.</div></div><button class="btn primary" onclick="admin(\'new\')">＋ إضافة معلم</button></div><div class="grid stats"><div class="stat"><span class="muted">المعلمون</span><b>'+db.teachers.length+'</b></div><div class="stat"><span class="muted">المهام</span><b>'+db.teachers.reduce((a,x)=>a+(x.tasks?.length||0),0)+'</b></div><div class="stat"><span class="muted">المواعيد</span><b>'+db.teachers.reduce((a,x)=>a+(x.events?.length||0),0)+'</b></div><div class="stat"><span class="muted">المراحل/الصفوف</span><b>'+db.teachers.reduce((a,x)=>a+(x.groups?.length||0),0)+'</b></div></div><div class="card"><h2>المعلمون</h2>'+db.teachers.map(x=>'<div class="teacher"><b>'+x.name+'<div class="muted" style="font-size:12px">'+x.subject+'</div></b><span>'+x.school+'</span><div>'+x.groups.map(g=>'<span class="tag">'+g.stage+' · '+g.grade+'</span>').join('')+'</div><button class="btn soft" onclick="teacher(\''+x.slug+'\')">فتح</button></div>').join('')+'</div>'}
function sopts(){return Object.keys(stages).map(x=>'<option>'+x+'</option>').join('')}function gropts(s='ابتدائي'){return stages[s].map(x=>'<option>'+x+'</option>').join('')}
function grow(){return '<div class="grouprow"><select name="stage" onchange="this.nextElementSibling.innerHTML=gropts(this.value)">'+sopts()+'</select><select name="grade">'+gropts()+'</select><button type="button" class="btn soft" onclick="this.parentElement.remove()">×</button></div>'}
function form(){main.innerHTML='<div class="hero"><div><h1>إضافة معلم</h1><div class="muted">يمكن للمعلم تدريس أكثر من مرحلة وصف.</div></div></div><form class="card form" onsubmit="create(event)"><div class="field"><label>اسم المعلم</label><input name="name" required></div><div class="field"><label>المادة</label><input name="subject" required></div><div class="field"><label>المدرسة</label><input name="school"></div><div class="span card" style="box-shadow:none;background:#fafaff"><div class="hero"><div><b>المراحل والصفوف</b><div class="muted">أضيفي كل مرحلة/صف يدرسه المعلم.</div></div><button type="button" class="btn soft" onclick="groups.insertAdjacentHTML(\'beforeend\',grow())">＋ إضافة</button></div><div id="groups" class="groups">'+grow()+'</div></div><div class="span"><b>التكليفات</b><p>'+['نافس','مناوبة','نشاط','موهبة','إرشاد','إعلام'].map(x=>'<label class="tag"><input type="checkbox" name="as" value="'+x+'"> '+x+'</label>').join('')+'</p></div><div class="span"><button class="btn primary">إنشاء مساحة المعلم</button></div></form>'}
function create(e){e.preventDefault();let f=e.target,groups=qa('.grouprow',f).map(r=>({stage:q('[name=stage]',r).value,grade:q('[name=grade]',r).value})),assign=qa('[name=as]:checked',f).map(x=>x.value),slug='teacher-'+Date.now().toString().slice(-5);db.teachers.push({name:f.name.value,subject:f.subject.value,school:f.school.value||'—',slug,groups,assign,schedule:[],tasks:[],events:[]});save();teacher(slug)}
function teacher(slug,tab='home'){let t=db.teachers.find(x=>x.slug===slug)||db.teachers[0];history.replaceState({},'',location.pathname+'?teacher='+t.slug);app.innerHTML=top()+'<div class="wrap"><div class="teacherHead"><div><h1>مرحبًا، أ. '+t.name+'</h1><div class="muted">'+t.subject+' · '+t.school+'</div></div></div><div class="nav">'+[['home','الرئيسية'],['schedule','جدولي'],['tasks','مهامي'],['events','المواعيد'],['assign','تكليفاتي']].map(x=>'<button class="'+(tab===x[0]?'on':'')+'" onclick="teacher(\''+t.slug+'\',\''+x[0]+'\')">'+x[1]+'</button>').join('')+'</div><div id="view"></div></div><div class="bottom">'+[['home','الرئيسية'],['schedule','جدولي'],['tasks','مهامي'],['events','المواعيد'],['assign','تكليفاتي']].map(x=>'<button class="'+(tab===x[0]?'on':'')+'" onclick="teacher(\''+t.slug+'\',\''+x[0]+'\')">'+x[1]+'</button>').join('')+'</div>';render(t,tab)}
function render(t,tab){if(tab==='schedule'){view.innerHTML='<div class="card"><h2>جدولي الأسبوعي</h2><div class="scroll"><table class="table"><tr><th>اليوم</th><th>الحصة</th><th>الوقت</th><th>المرحلة</th><th>الصف</th><th>الشعبة</th></tr>'+t.schedule.map(x=>'<tr>'+x.map(v=>'<td>'+v+'</td>').join('')+'</tr>').join('')+'</table></div></div>';return}if(tab==='tasks'){view.innerHTML='<div class="card"><h2>مهامي</h2>'+t.tasks.map(x=>'<div class="task"><input type="checkbox"><div><b>'+x[0]+'</b><div class="muted">'+x[3]+' · '+x[4]+'</div></div><span class="tag '+(x[1]&&x[2]?'red':x[1]?'orange':'blue')+'">'+(x[1]&&x[2]?'مهم وعاجل':x[1]?'مهم وغير عاجل':'غير مهم وعاجل')+'</span></div>').join('')+'</div>';return}if(tab==='events'){view.innerHTML='<div class="card"><h2>المواعيد المهمة</h2>'+t.events.map(x=>'<div class="event"><div class="date">'+x[0]+'<br><small>'+x[1]+'</small></div><b>'+x[2]+'</b></div>').join('')+'</div>';return}if(tab==='assign'){view.innerHTML='<div class="card"><h2>تكليفاتي</h2>'+t.assign.map(x=>'<div class="event"><div class="date">◇</div><div><b>'+x+'</b><div class="muted">مهام وشواهد هذا التكليف</div></div></div>').join('')+'</div>';return}view.innerHTML='<div class="teacherMain"><div><div class="grid today"><div class="stat"><span class="muted">الحصص</span><b>'+t.schedule.length+'</b></div><div class="stat"><span class="muted">المراحل/الصفوف</span><b>'+t.groups.length+'</b></div><div class="stat"><span class="muted">المهام</span><b>'+t.tasks.length+'</b></div></div><div class="card"><h2>مهام اليوم</h2>'+t.tasks.map(x=>'<div class="task"><input type="checkbox"><div><b>'+x[0]+'</b><div class="muted">'+x[3]+' · '+x[4]+'</div></div></div>').join('')+'</div></div><div class="grid"><div class="card"><h3>الصفوف التي أدرسها</h3><p>'+t.groups.map(g=>'<span class="tag">'+g.stage+' · '+g.grade+'</span>').join('')+'</p></div><div class="card"><h3>تكليفاتي</h3><p>'+t.assign.map(x=>'<span class="tag">'+x+'</span>').join('')+'</p></div></div></div>'}
function reset(){localStorage.removeItem('tp-demo');db=JSON.parse(JSON.stringify(seed));admin()}let p=new URLSearchParams(location.search);p.get('teacher')?teacher(p.get('teacher')):admin();
</script></body></html>
